plugins { id 'com.android.application' }
def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
android {
    namespace 'com.chaman.voicetest'
    compileSdk 34
    defaultConfig {
        applicationId 'com.chaman.voicetest'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "0.1.2"
    }
    signingConfigs {
        chaman {
            storeFile file('chaman-test.jks')
            storePassword 'chaman123'
            keyAlias 'chaman'
            keyPassword 'chaman123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.chaman }
        release { signingConfig signingConfigs.chaman }
    }
    androidResources { noCompress 'onnx' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'
}
